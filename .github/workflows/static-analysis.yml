name: Static Analysis

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  clang-tidy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install clang-tidy
        run: |
          sudo apt-get update -q
          sudo apt-get install -y clang-tidy-20

      - name: Configure
        uses: ./.github/actions/configure
        with:
          cmake-extra-args: -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Run clang-tidy
        run: run-clang-tidy-20 -p build/build/Release 'src/.*'

  iwyu:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install IWYU
        run: |
          sudo apt-get update -q
          sudo apt-get install -y iwyu

      - name: Configure
        uses: ./.github/actions/configure
        with:
          cmake-extra-args: -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Run IWYU
        run: |
          IWYU_TOOL=$(find /usr -name "iwyu_tool.py" 2>/dev/null | head -1)
          if [ -z "$IWYU_TOOL" ]; then
            echo "ERROR: iwyu_tool.py not found under /usr"
            dpkg -L iwyu
            exit 1
          fi
          echo "Using: $IWYU_TOOL"
          iwyu_output=$(python3 "$IWYU_TOOL" -p build/build/Release 2>&1 || true)
          echo "$iwyu_output"
          if echo "$iwyu_output" | grep -q "should add\|should remove"; then
            exit 1
          fi
