name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }} / ${{ matrix.build_type }}
    permissions:
      checks: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
            build_type: Release
          - os: macos-26
            name: macos
            build_type: Release
          - os: windows-2025-vs2026
            name: windows
            build_type: Release

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install software Vulkan renderer (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y libvulkan1 mesa-vulkan-drivers
          echo "VK_ICD_FILENAMES=$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' | head -1)" >> "$GITHUB_ENV"

      - name: Install MoltenVK (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install molten-vk vulkan-loader
          echo "VK_ICD_FILENAMES=$(brew --prefix molten-vk)/share/vulkan/icd.d/MoltenVK_icd.json" >> "$GITHUB_ENV"

      - name: Set up Conan
        uses: ./.github/actions/setup-conan

      - name: Install dependencies
        uses: ./.github/actions/conan-cache
        with:
          build-type: ${{ matrix.build_type }}
          warm: "true"

      - name: Build
        if: runner.os != 'Linux'
        run: conan build . -of build -s build_type=${{ matrix.build_type }} -c tools.build:skip_test=True

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: conan build . -of build -s build_type=${{ matrix.build_type }} --lockfile-partial -c tools.build:skip_test=True

      - name: Test (Linux)
        if: runner.os == 'Linux'
        run: |
          ctest --test-dir build/build/${{ matrix.build_type }} \
            --output-on-failure \
            --output-junit ${{ runner.temp }}/test-results.xml

      - name: Publish test results
        uses: dorny/test-reporter@v1
        if: runner.os == 'Linux' && (success() || failure())
        with:
          name: Tests
          path: ${{ runner.temp }}/test-results.xml
          reporter: java-junit
          fail-on-empty: 'false'
