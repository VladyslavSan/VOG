name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }} / ${{ matrix.build_type }}
    permissions:
      checks: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-26.04
            name: linux
            build_type: Release
          # Debug keeps every VOG_ASSERT, so one runner exercises them under the validation layer.
          - os: ubuntu-26.04
            name: linux
            build_type: Debug
          - os: macos-26
            name: macos
            build_type: Release
          - os: windows-2025-vs2026
            name: windows
            build_type: Release

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install software Vulkan renderer, validation layer and X server (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo add-apt-repository -y ppa:kisak/kisak-mesa
          sudo apt-get update -q
          sudo apt-get install -y libvulkan1 mesa-vulkan-drivers vulkan-validationlayers vulkan-tools xvfb xauth
          echo "VK_ICD_FILENAMES=$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' | head -1)" >> "$GITHUB_ENV"

      - name: Require descriptor heaps (Linux)
        if: runner.os == 'Linux'
        run: |
          # Capture first: a failing vulkaninfo then fails with its own error, not as a missing extension.
          vulkaninfo > "${{ runner.temp }}/vulkaninfo.txt"
          grep -q VK_EXT_descriptor_heap "${{ runner.temp }}/vulkaninfo.txt" || { echo "lavapipe lacks VK_EXT_descriptor_heap: check ppa:kisak/kisak-mesa"; exit 1; }

      - name: Install MoltenVK (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install molten-vk vulkan-loader vulkan-validationlayers
          echo "VK_ICD_FILENAMES=$(brew --prefix molten-vk)/etc/vulkan/icd.d/MoltenVK_icd.json" >> "$GITHUB_ENV"
          # The bottle's manifest names the layer dylib without a directory, and dyld never
          # searches /opt/homebrew/lib for a bare name: createInstance fails with ErrorLayerNotPresent.
          vvl="$(brew --prefix vulkan-validationlayers)"
          manifest="$vvl/share/vulkan/explicit_layer.d/VkLayer_khronos_validation.json"
          test -f "$vvl/lib/libVkLayer_khronos_validation.dylib"
          sed -i '' "s|\"libVkLayer_khronos_validation.dylib\"|\"$vvl/lib/libVkLayer_khronos_validation.dylib\"|" "$manifest"
          grep -q '"library_path": "/' "$manifest"
          echo "VK_ADD_LAYER_PATH=$vvl/share/vulkan/explicit_layer.d" >> "$GITHUB_ENV"

      - name: Set up Conan
        uses: ./.github/actions/setup-conan

      - name: Install dependencies
        uses: ./.github/actions/conan-cache
        with:
          build-type: ${{ matrix.build_type }}
          warm: "true"

      - name: Build
        if: runner.os != 'Linux'
        run: conan build . -of build -s build_type=${{ matrix.build_type }} -c tools.build:skip_test=True

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: conan build . -of build -s build_type=${{ matrix.build_type }} --lockfile-partial -c tools.build:skip_test=True

      - name: Test (Linux)
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a ctest --test-dir build/build/${{ matrix.build_type }} \
            --output-on-failure \
            --output-junit ${{ runner.temp }}/test-results.xml

      - name: No skipped tests (Linux)
        if: runner.os == 'Linux'
        run: |
          # CTest's junit writer marks a skipped test status="notrun" (with a <skipped> child).
          test -s "${{ runner.temp }}/test-results.xml"
          if grep -n 'status="notrun"' "${{ runner.temp }}/test-results.xml"; then
            echo "A skipped test is lost coverage on the CI driver stack."
            exit 1
          fi

      - name: Test (macOS)
        if: runner.os == 'macOS'
        run: |
          ctest --test-dir build/build/${{ matrix.build_type }} --output-on-failure

      - name: Publish test results
        uses: dorny/test-reporter@v1
        if: runner.os == 'Linux' && (success() || failure())
        with:
          name: Tests (${{ matrix.build_type }})
          path: ${{ runner.temp }}/test-results.xml
          reporter: java-junit
          fail-on-empty: 'false'
