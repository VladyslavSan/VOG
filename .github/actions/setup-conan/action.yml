name: Set up Conan
description: Install Python and Conan 2, then detect the default profile.

inputs:
  python-version:
    description: Python version to install.
    required: false
    default: "3.12"

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install Conan
      shell: bash
      run: pip install conan

    - name: Detect Conan profile
      shell: bash
      run: |
        conan profile detect --force
        echo "CONAN_PROFILE=$HOME/.conan2/profiles/default" >> "$GITHUB_ENV"
        cat $CONAN_PROFILE

    - name: Set the C++ standard of the Conan profile
      shell: bash
      run: |
        # conanfile.py names the standard (CPPSTD); the profile must match what it requires. A
        # Windows checkout has CRLF line ends.
        cppstd=$(tr -d '\r' < conanfile.py | sed -n 's/^CPPSTD = \([0-9][0-9]*\)$/\1/p')
        test -n "$cppstd" || { echo "CPPSTD not found in conanfile.py"; exit 1; }
        if ! grep -q "compiler.cppstd=$cppstd" "$CONAN_PROFILE"; then
          echo "Patching compiler.cppstd to $cppstd"
          sed "s/compiler\.cppstd=.*/compiler.cppstd=$cppstd/" "$CONAN_PROFILE" > /tmp/conan_profile
          mv /tmp/conan_profile "$CONAN_PROFILE"
        fi
        cat "$CONAN_PROFILE"
